name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: App (Node 16)
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test --watchAll=false
      - run: yarn build

  specs:
    name: Specs (OpenSpec)
    runs-on: ubuntu-latest
    env:
      OPENSPEC_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v4

      # A CLI do OpenSpec exige Node >= 20.19, diferente do Node 16 do app.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npx --yes @fission-ai/openspec@1.14.0 validate --all --strict
