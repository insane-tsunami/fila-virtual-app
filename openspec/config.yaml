schema: spec-driven

context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Projeto: ZeraFilas / Fila Virtual (MegaHack 2.0) — plataforma de fila virtual
  para estabelecimentos atenderem clientes sem aglomeração.
  Front-end: React 16 (Create React App 3.4.1), Material-UI v4, styled-components,
  react-router v5. Rotas: /, /cadastro, /login, /dashboard, /dashboard/qrcode,
  /dashboard/perfil e a rota pública /fila/:slug (página do cliente, sem login).
  Backend (server/): PHP 8.3+ com Composer (Slim 4, illuminate/database, guzzle),
  MySQL em produção e SQLite nos testes. Tabelas estabelecimentos (nome, slug,
  endereco_publico, conta_id), contas (e-mail, CNPJ numérico ou alfanumérico com dígito verificador conferido e
  guardado em maiúsculas, hash da senha), sessoes
  (hash do token, validade) e entradas_fila (migrações em
  server/database/migrations). Cada conta é dona de uma loja criada no cadastro.
  API pública: POST /api/contas (cadastro), POST /api/sessoes (login),
  GET /api/filas/{slug} e as chamadas do cliente em /api/filas/{slug}/entradas.
  API com sessão (Authorization: Bearer <token>, 7 dias, token só como hash no
  banco): GET /api/conta, PUT /api/conta/senha, DELETE /api/sessao e, só para a
  loja da própria conta, listar a fila, finalizar e PUT /api/filas/{slug}/endereco
  (specs queue-intake, queue-management, store-address, establishment-account,
  account-session e api-platform). A antiga chave X-API-Key foi removida.
  Estado atual: o front inteiro consome a API por src/api.js (base em
  REACT_APP_API_URL): cadastro, login, dashboard (fila real, atualização a cada
  5 s), QR code, Perfil (trocar a senha) e a página do cliente. As rotas do
  dashboard ficam atrás do login (src/sessao); o token fica em sessionStorage.
  Pendências: avatar, confirmação de e-mail, "esqueci a senha", limite de
  tentativas. Node 16 fixado para o front.
  Segredos (credenciais de banco etc.) NUNCA no código: usar variáveis de
  ambiente (ver server/.env.example).
  Estilo: ESLint (airbnb) + Prettier; ver .eslintrc.js e .prettierrc.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
