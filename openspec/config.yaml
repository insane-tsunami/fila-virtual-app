schema: spec-driven

context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Projeto: ZeraFilas / Fila Virtual (MegaHack 2.0) — plataforma de fila virtual
  para estabelecimentos atenderem clientes sem aglomeração.
  Front-end: React 16 (Create React App 3.4.1), Material-UI v4, styled-components,
  react-router v5. Rotas: /, /cadastro, /login, /dashboard, /dashboard/qrcode,
  /dashboard/perfil e a rota pública /fila/:slug (página do cliente, sem login).
  Backend (server/): PHP 8.3+ com Composer (Slim 4, illuminate/database, guzzle),
  MySQL em produção e SQLite nos testes. Tabelas estabelecimentos (com o
  endereco_publico de cada loja) e entradas_fila (migrações em
  server/database/migrations). API: GET /api/filas/{slug} (público),
  PUT /api/filas/{slug}/endereco (chave) e /api/filas/{slug}/entradas
  (specs queue-intake, queue-management, store-address e api-platform); as rotas
  do dashboard usam uma chave provisória (X-API-Key). Sem login e sem multi-loja.
  Estado atual: a página do cliente (/fila/:slug, spec customer-queue-page), o
  dashboard (fila real com atualização a cada 5 s e finalizar atendimento) e o
  QR code consomem a API por src/api.js, com a base em REACT_APP_API_URL. As
  páginas /dashboard e /dashboard/qrcode pedem a chave provisória X-API-Key em
  uma tela de chave (spec dashboard-access), guardada só em sessionStorage;
  só o Perfil (/dashboard/perfil) ainda usa dados fictícios. Node 16 fixado
  para o front.
  Segredos (credenciais de banco etc.) NUNCA no código: usar variáveis de
  ambiente (ver server/.env.example).
  Estilo: ESLint (airbnb) + Prettier; ver .eslintrc.js e .prettierrc.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
